name: Build Mission Control preview (isolated)

on:
  push:
    branches:
      - "audit/mission-control-port-20261024"
    paths:
      - ".github/workflows/build-mission-control-preview.yml"
      - "package.json"
      - "tsconfig.json"
      - "vite.config.ts"
      - "tailwind.config.js"
      - "postcss.config.js"
      - "src/**"
      - "port/mission-control-ui/**"
      - "index.html"

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout validated calendar feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/pto-ledger-and-awards
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Run tests and production build
        run: npm run verify
      - name: Upload static preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: lifeos-gemini-preview-dist
          path: dist/
          if-no-files-found: error
          retention-days: 7
      - name: Configure isolated GitHub Pages preview
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish isolated preview
        id: deployment
        uses: actions/deploy-pages@v4

# Deployment is initiated only from the designated isolated preview branch.
# Its build checks out the validated calendar feature branch.
