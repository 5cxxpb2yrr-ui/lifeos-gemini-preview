name: Build Mission Control preview (isolated)

on:
  push:
    branches:
      - "audit/mission-control-port-20261024"
    paths:
      - ".github/workflows/build-mission-control-preview.yml"
      - "package.json"
      - "tsconfig.json"
      - "vite.config.ts"
      - "tailwind.config.js"
      - "postcss.config.js"
      - "src/**"
      - "port/mission-control-ui/**"
      - "index.html"

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout isolated branch
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Run tests and production build
        run: npm run verify
      - name: Upload static preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: lifeos-gemini-preview-dist
          path: dist/
          if-no-files-found: error
          retention-days: 7
      - name: Configure isolated GitHub Pages preview
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/
      - name: Publish isolated preview
        id: deployment
        uses: actions/deploy-pages@v4

# CI and Pages deployment intentionally run only for this isolated preview branch.
