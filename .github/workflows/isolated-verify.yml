name: Isolated Branch Verification

on:
  push:
    branches:
      - audit/mission-control-port-20261024
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: isolated-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Tests and production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout isolated branch
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run tests and production build
        run: npm run verify
