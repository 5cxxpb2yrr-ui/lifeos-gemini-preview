name: Build and deploy PTO-enabled isolated preview (ledger sync + confirmed carryover)

on:
  push:
    branches:
      - preview
    paths:
      - ".github/workflows/publish-pto-preview.yml"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pto-isolated-preview-publish
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out PTO feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/pto-ledger-and-awards
          path: source

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install and verify
        working-directory: source
        run: |
          npm install
          npm run verify

      - name: Check out isolated preview branch
        uses: actions/checkout@v4
        with:
          ref: preview
          path: published
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish built files to preview branch
        run: |
          test -s source/dist/index.html
          test -d source/dist/assets
          cp source/dist/index.html published/index.html
          rm -rf published/assets
          cp -R source/dist/assets published/assets
          cd published
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets
          git commit -m "Publish PTO feature build to isolated preview" || {
            echo "No preview asset changes to publish."
            exit 0
          }
          git push origin HEAD:preview

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload PTO-enabled Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: source/dist

      - name: Deploy PTO-enabled isolated preview
        id: deployment
        uses: actions/deploy-pages@v4
